navController = { group = "androidx.navigation", name = "navigation-compose", version.ref="navControllerV"}

dataPreferences ={group="androidx.datastore", name="datastore-preferences", version.ref="dataPreferencesV"}

kotlinx-serialization-json = {group="org.jetbrains.kotlinx", name="kotlinx-serialization-json", version.ref="kotlinxSerialization"}

